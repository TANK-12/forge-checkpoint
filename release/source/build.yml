# Builds Forge's downloads on Linux, then starts every app of each download
# on its own system. It runs only when started by hand (Actions tab, "Build
# Forge", "Run workflow"). Nothing is published: the downloads stay with the
# run as artifacts.
name: Build Forge

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Tools
        run: python -m pip install uv pytest
      - name: Test the launcher and the builder
        run: python -m pytest -q tests
      - name: Build every download
        run: python release/build.py --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: forge-downloads
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/report-*.json

  check:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: forge-downloads
          path: dist
      - name: Unpack
        shell: bash
        run: |
          cd dist
          if [ -f forge-*-${{ matrix.target }}.zip ]; then
            unzip -q forge-*-${{ matrix.target }}.zip
          else
            tar -xzf forge-*-${{ matrix.target }}.tar.gz
          fi
      - name: Start every app and check that each answers
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            windows-*) dist/Forge/runtime/python.exe dist/Forge/forge_portable.py --smoke --report smoke.json ;;
            macos-*) dist/Forge/Forge.app/Contents/MacOS/Forge --smoke --report smoke.json ;;
            *) dist/Forge/forge --smoke --report smoke.json ;;
          esac
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: smoke.json
