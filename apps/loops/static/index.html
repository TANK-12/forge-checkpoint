<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' blob:; frame-src 'none'; object-src 'none'">
<title>Loops</title>
<link rel="stylesheet" href="/shared/forge.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <h1>Loops</h1>
  <button id="play" class="btn btn-primary play" type="button">Play</button>
  <label>Tempo <input id="bpm" type="number" min="40" max="240" step="1" value="110"> bpm</label>
  <label>Swing <input id="swing" type="range" min="0" max="0.6" step="0.05" value="0"> <span id="swing-val">0%</span></label>
  <label>Steps <select id="steps"></select></label>
  <button id="clear" class="btn" type="button">Clear</button>
  <span class="grow"></span>
  <span class="muted small">Loops go to <code id="out-dir">...</code></span>
</header>
<main class="desk">
  <section class="grid" id="grid" aria-label="Pattern grid"></section>
  <aside class="side">
    <h2>Pattern</h2>
    <input id="name" type="text" maxlength="80" placeholder="Name, like Night drive" aria-label="Pattern name">
    <button id="save" class="btn btn-primary" type="button">Save pattern</button>
    <div id="patterns" class="patterns"></div>
    <h2>Export</h2>
    <label>Repeats <select id="repeats"><option>1</option><option>2</option><option selected>4</option><option>8</option></select></label>
    <button id="export" class="btn btn-primary" type="button">Export WAV</button>
    <p class="muted small">A WAV of the loop, its tail folded into the start so it repeats without a gap. A name in use gets (2).</p>
    <audio id="preview" controls hidden></audio>
    <p id="status" class="status" role="status"></p>
  </aside>
</main>
<script type="module" src="app.js"></script>
<script src="/shared/forge_chrome.js"></script>
</body>
</html>
