# Runs only on demand; downloads the fixed checkpoint, never builds a new one.
name: Check saved checkpoint
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to download and check
        default: checkpoint-2026-10-28-allapps
# Write only so the download step can read a draft release, checked here
# before it is made public. Checkout keeps no token, and only that one
# step is given it; nothing here uploads, tags or pushes.
permissions:
  contents: write
jobs:
  smoke:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-latest, target: windows-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Add pyobjc on Macs (the release's Mac Python carries it; the trash helper uses it)
        if: runner.os == 'macOS'
        run: python -m pip install pyobjc-framework-Cocoa
      - name: Test install helpers, smart search and the trash helper
        timeout-minutes: 10
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_checkpoint.py tests/test_forge_ask.py tests/test_forge_trash.py
      - name: Download saved checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir checkpoint
          case "$TARGET" in windows-*) suffix=zip ;; *) suffix=tar.gz ;; esac
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "forge-0.2.0-$TARGET.$suffix" --pattern SHA256SUMS --dir checkpoint
      - name: Verify and unpack
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import hashlib, os, pathlib, tarfile, zipfile
          folder = pathlib.Path('checkpoint')
          target = os.environ['TARGET']
          suffix = 'zip' if target.startswith('windows-') else 'tar.gz'
          name = f'forge-0.2.0-{target}.{suffix}'
          expected = dict(line.split('  ', 1)[::-1] for line in (folder/'SHA256SUMS').read_text().splitlines())
          assert hashlib.sha256((folder/name).read_bytes()).hexdigest() == expected[name]
          if suffix == 'zip':
              with zipfile.ZipFile(folder/name) as archive: archive.extractall(folder)
          else:
              with tarfile.open(folder/name) as archive: archive.extractall(folder, filter='data')
      - name: Install the real Mac or Windows download with its helper
        shell: python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          import os, pathlib, subprocess
          target = os.environ['TARGET']
          if target.startswith('macos-'):
              archive = pathlib.Path(f'checkpoint/forge-0.2.0-{target}.tar.gz').resolve()
              destination = pathlib.Path(os.environ['RUNNER_TEMP'])/'installed Forge.app'
              subprocess.run(['sh', 'scripts/install-macos.sh', str(archive), str(destination)], check=True)
          elif target.startswith('windows-'):
              archive = pathlib.Path('checkpoint/forge-0.2.0-windows-x64.zip').resolve()
              env = {key: value for key, value in os.environ.items() if key.upper() != 'PSMODULEPATH'}
              subprocess.run(['powershell', '-NoProfile', '-File', 'scripts/install-windows.ps1', '-Archive', str(archive), '-Destination', 'checkpoint-installed'], env=env, check=True)
      - name: Smoke every shipped app without opening a window
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          case "$TARGET" in
            macos-*) "$RUNNER_TEMP/installed Forge.app/Contents/MacOS/Forge" --smoke --report smoke.json ;;
            windows-*) checkpoint-installed/runtime/python.exe checkpoint-installed/forge_portable.py --smoke --report smoke.json ;;
            *) checkpoint/Forge/forge --smoke --report smoke.json ;;
          esac
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: checkpoint-smoke-${{ matrix.target }}
          path: smoke.json
